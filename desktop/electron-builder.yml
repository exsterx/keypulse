appId: com.keypulse.desktop
productName: Keypulse
directories:
  output: release

files:
  - main.js
  - preload.js
  - renderer/**/*
  - locales/**/*
  - dist/**/*

npmRebuild: false
asarUnpack:
  - "**/*.node"

win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - ru_RU

appId: com.keypulse.desktop
productName: Keypulse
directories:
  output: release

files:
  - main.js
  - preload.js
  - renderer/**/*
  - locales/**/*
  - assets/**/*
  - dist/**/*

npmRebuild: false
asarUnpack:
  - "**/*.node"

win:
  icon: assets/logo.ico
  target:
    - nsis
    - portable

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - ru_RU

portable:
  artifactName: ${productName}-${version}-portable.${ext}
